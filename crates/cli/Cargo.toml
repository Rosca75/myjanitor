[package]
name = "mj-cli"
description = "myjanitor-cli: command-line front end over mj-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mj-core.workspace = true
mj-engine.workspace = true
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
mj-core = { workspace = true, features = ["testutil"] }

[[bin]]
name = "myjanitor-cli"
path = "src/main.rs"
