[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/scan",
    "crates/dupes",
    "crates/filters",
    "crates/detect",
    "crates/actions",
    "crates/formats",
    "crates/optimise",
    "crates/engine",
    "crates/cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
authors = ["MyJanitor contributors"]

# Every external crate is pinned exactly (`=`) and justified in docs/DEPENDENCIES.md.
# Cargo.lock is committed. Do not add a dependency here without a DEPENDENCIES.md entry.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
miniz_oxide = "=0.8.9"
regex = "=1.13.1"
tauri = { version = "=2.12.3", features = [] }
tauri-build = { version = "=2.7.2", features = [] }

# Internal crates.
mj-core = { path = "crates/core" }
mj-platform = { path = "crates/platform" }
mj-scan = { path = "crates/scan" }
mj-dupes = { path = "crates/dupes" }
mj-filters = { path = "crates/filters" }
mj-detect = { path = "crates/detect" }
mj-actions = { path = "crates/actions" }
mj-formats = { path = "crates/formats" }
mj-optimise = { path = "crates/optimise" }
mj-engine = { path = "crates/engine" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Required: worker threads isolate panics with catch_unwind (see ARCHITECTURE.md).
panic = "unwind"

# Optimised test builds without LTO (CI and performance tests).
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
