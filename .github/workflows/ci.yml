# Continuous integration for MyJanitor: quality gates, then installable bundles.
# No secrets, no signing, no publishing. Artifacts are uploaded for download only.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# One run per ref; a newer push cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned toolchain: at or above the workspace rust-version (1.88) and Tauri 2.12's own minimum (1.90).
  RUST_VERSION: "1.97.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev build-essential pkg-config libssl-dev file patchelf xdg-utils

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --workspace --no-fail-fast

      # Plain ES modules, no bundler, no npm install needed.
      - name: Frontend tests
        run: node --test ui/

  bundle:
    name: bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # AppImage tooling: runners have no FUSE, and stripping breaks some bundled libraries.
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev build-essential pkg-config libssl-dev file patchelf xdg-utils

      # tauri-cli is compiled from source (slow), so the binary is cached per OS.
      - name: Cache tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ matrix.os }}-${{ env.RUST_VERSION }}

      - name: Install tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # The bundle list is chosen here per OS, so tauri.conf.json (appimage, deb) needs no edit.
      - name: Build bundles (Linux deb and AppImage)
        if: runner.os == 'Linux'
        run: cargo tauri build --bundles deb,appimage -- --locked

      - name: Build bundles (Windows NSIS installer)
        if: runner.os == 'Windows'
        run: cargo tauri build --bundles nsis -- --locked

      - name: Build CLI
        run: cargo build --locked --release -p mj-cli

      # Paths stay relative to the repo root (no cd) so the upload globs below match.
      - name: List build output
        run: find target/release -maxdepth 4 \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name 'myjanitor*' \) -type f -not -name '*.d' | sort

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: myjanitor-linux-x64-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: myjanitor-windows-x64-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows portable exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: myjanitor-windows-x64-portable
          path: target/release/myjanitor.exe
          if-no-files-found: error

      - name: Upload CLI (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: myjanitor-cli-linux-x64
          path: target/release/myjanitor-cli
          if-no-files-found: error

      - name: Upload CLI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: myjanitor-cli-windows-x64
          path: target/release/myjanitor-cli.exe
          if-no-files-found: error
